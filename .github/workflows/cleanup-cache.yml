name: Cleanup Scripture Cache

on:
  # Run daily at 3 AM UTC (after backup completes at 2 AM)
  schedule:
    - cron: '0 3 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days_to_keep:
        description: 'Number of days to keep cached entries'
        required: false
        default: '30'
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install @supabase/supabase-js
      
      - name: Cleanup old scripture cache entries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_KEY
          );
          
          async function cleanupCache() {
            try {
              const daysToKeep = parseInt('${{ inputs.days_to_keep }}' || '30');
              console.log(\`🧹 Cleaning up scripture cache entries older than \${daysToKeep} days...\`);
              
              // First check if the table exists
              const { count: tableCount, error: tableError } = await supabase
                .from('scripture_cache')
                .select('*', { count: 'exact', head: true });
              
              if (tableError) {
                if (tableError.code === '42P01') {
                  console.log('⚠️  scripture_cache table does not exist. Skipping cleanup.');
                  console.log('📝 Run gospel-admin/sql/create_scripture_cache.sql in Supabase SQL Editor to create it.');
                  process.exit(0);
                } else {
                  console.error('❌ Error checking table:', tableError);
                  process.exit(1);
                }
              }
              
              console.log(\`📊 Current cache entries: \${tableCount || 0}\`);
              
              // Try to call the cleanup function
              const { data, error } = await supabase.rpc('cleanup_old_scripture_cache', {
                days_to_keep: daysToKeep
              });
              
              if (error) {
                if (error.code === '42883') {
                  console.log('⚠️  cleanup_old_scripture_cache function does not exist. Skipping cleanup.');
                  console.log('📝 Run gospel-admin/sql/create_scripture_cache.sql in Supabase SQL Editor to create it.');
                  process.exit(0);
                }
                console.error('❌ Error cleaning up cache:', error);
                process.exit(1);
              }
              
              console.log(\`✅ Successfully deleted \${data || 0} old scripture cache entries\`);
              
              // Get updated cache statistics
              const { count: finalCount, error: statsError } = await supabase
                .from('scripture_cache')
                .select('*', { count: 'exact', head: true });
              
              if (!statsError) {
                console.log(\`📊 Remaining cache entries: \${finalCount || 0}\`);
              }
              
            } catch (err) {
              console.error('❌ Cleanup failed:', err);
              process.exit(1);
            }
          }
          
          cleanupCache();
          "
      
      - name: Report cleanup results
        if: success()
        run: |
          echo "✅ Scripture cache cleanup completed successfully"

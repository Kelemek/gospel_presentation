name: Cleanup Verification Codes

on:
  # Run daily at 3 AM UTC
  schedule:
    - cron: '0 3 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install @supabase/supabase-js ws

      - name: Run verification codes cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const ws = require('ws');
          if (!globalThis.WebSocket) globalThis.WebSocket = ws;

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          (async () => {
            try {
              const { data, error } = await supabase.rpc('cleanup_expired_verification_codes');

              if (error) {
                console.error('Cleanup failed:', error.message);
                process.exit(1);
              }

              const deleted = data ?? 0;
              console.log('Verification codes cleanup completed: deleted', deleted, 'rows');
              if (deleted === 0) {
                console.log('Note: Only codes expired/used more than 24 hours ago are removed.');
                console.log('Verify SUPABASE_URL/SUPABASE_SERVICE_KEY point to the correct project.');
              }
            } catch (err) {
              console.error('Cleanup failed:', err);
              process.exit(1);
            }
          })();
          "

name: Backup Supabase Database

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          npm install @supabase/supabase-js ws
      
      - name: Create backup directory
        run: mkdir -p backups
      
      - name: Backup database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const ws = require('ws');
          const fs = require('fs');
          const path = require('path');
          if (!globalThis.WebSocket) globalThis.WebSocket = ws;
          
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { realtime: { transport: ws } }
          );
          
          async function backup() {
            try {
              const timestamp = new Date().toISOString().split('T')[0];
              
              // Discover tables via get_backup_tables() RPC (falls back to default list if function missing)
              let tablesToBackup;
              const { data: tableRows, error: rpcError } = await supabase.rpc('get_backup_tables');
              if (rpcError || !tableRows?.length) {
                console.log('Using default table list (run 20250303_get_backup_tables.sql to enable discovery)');
                tablesToBackup = ['admin_settings', 'bible_verses', 'coma_templates', 'profile_access', 'profiles', 'translation_settings', 'user_profiles'];
              } else {
                tablesToBackup = tableRows.map(r => r.table_name);
                console.log('Discovered tables:', tablesToBackup.join(', '));
              }
              
              const tables = {};
              const backupStats = {};
              const PAGE_SIZE = 1000;
              
              async function fetchAllRows(tableName) {
                const all = [];
                let from = 0;
                while (true) {
                  const { data, error } = await supabase.from(tableName).select('*').range(from, from + PAGE_SIZE - 1);
                  if (error) throw error;
                  all.push(...(data || []));
                  if (!data || data.length < PAGE_SIZE) break;
                  from += PAGE_SIZE;
                }
                return all;
              }
              
              for (const tableName of tablesToBackup) {
                try {
                  const data = await fetchAllRows(tableName);
                  tables[tableName] = data;
                  backupStats[tableName] = data.length;
                  console.log(\`✓ Backed up '\${tableName}': \${data.length} rows\`);
                } catch (err) {
                  console.log(\`⚠️  Warning: Could not backup table '\${tableName}': \${err.message}\`);
                  tables[tableName] = [];
                  backupStats[tableName] = 0;
                }
              }
              
              const backup = {
                backup_date: new Date().toISOString(),
                backup_type: 'automated',
                version: '1.3',
                tables: tables
              };
              
              const filename = \`database-backup-\${timestamp}.json\`;
              fs.writeFileSync(path.join('backups', filename), JSON.stringify(backup, null, 2));
              fs.writeFileSync(path.join('backups', 'latest-backup.json'), JSON.stringify(backup, null, 2));
              
              // Individual profile backups (profiles + user_profiles)
              const profilesDir = path.join('backups', 'profiles');
              fs.mkdirSync(profilesDir, { recursive: true });
              const profileRows = tables.profiles || [];
              profileRows.forEach(p => {
                const name = p.slug || p.id || 'unknown';
                fs.writeFileSync(
                  path.join(profilesDir, \`gospel-profile-\${name}-backup-\${timestamp}.json\`),
                  JSON.stringify({ profile: p, backup: { exportedAt: new Date().toISOString(), exportedBy: 'GitHub Actions', version: '1.0' } }, null, 2)
                );
              });
              const userProfiles = tables.user_profiles || [];
              userProfiles.forEach(p => {
                const name = p.username || p.display_name || p.id || 'unknown';
                fs.writeFileSync(
                  path.join(profilesDir, \`user-profile-\${String(name).replace(/[^a-z0-9-]/gi, '_')}-backup-\${timestamp}.json\`),
                  JSON.stringify({ profile: p, backup: { exportedAt: new Date().toISOString(), exportedBy: 'GitHub Actions', version: '1.0' } }, null, 2)
                );
              });
              
              console.log(\`\n✅ Backup created: \${filename}\`);
              console.log('   Table Summary:');
              Object.entries(backupStats).forEach(([t, c]) => console.log(\`   - \${t}: \${c} rows\`));
            } catch (error) {
              console.error('❌ Backup failed:', error);
              process.exit(1);
            }
          }
          backup();
          "
      
      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: backups/
          retention-days: 2
          compression-level: 9

name: Sync ACBC external links

on:
  # Weekly reconcile (Sunday 06:00 UTC)
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync mode'
        required: true
        default: reconcile
        type: choice
        options:
          - reconcile
          - add-sections

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: gospel-admin/.nvmrc
          cache: npm
          cache-dependency-path: gospel-admin/package-lock.json

      - name: Install dependencies
        working-directory: gospel-admin
        run: npm ci

      - name: Reconcile ACBC links
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'reconcile'
        working-directory: gospel-admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run sync-acbc-links -- --reconcile

      - name: Add missing ACBC sections and reconcile
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'add-sections'
        working-directory: gospel-admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run add-acbc-sections

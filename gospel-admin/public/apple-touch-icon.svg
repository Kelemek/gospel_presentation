<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background - matches header (from-slate-700 to-slate-800) -->
  <rect width="180" height="180" fill="url(#headerBg)" rx="20"/>
  
  <!-- Bible cover (dark brown/black book) - centered -->
  <rect x="45" y="25" width="90" height="130" rx="5" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  
  <!-- Bible spine shadow -->
  <rect x="45" y="25" width="12" height="130" rx="5" fill="#000"/>
  
  <!-- Pages -->
  <rect x="57" y="35" width="66" height="110" fill="#f8f8f8"/>
  
  <!-- Cross symbol (raised, bottom longer than top) -->
  <rect x="86" y="54" width="8" height="52" fill="#d4af37"/>
  <rect x="74" y="70" width="32" height="8" fill="#d4af37"/>
  
  <!-- Text lines -->
  <rect x="65" y="110" width="50" height="3" fill="#666"/>
  <rect x="65" y="118" width="45" height="3" fill="#666"/>
  <rect x="65" y="126" width="40" height="3" fill="#666"/>
  
  <!-- Page edge highlight -->
  <rect x="119" y="35" width="4" height="110" fill="#e0e0e0"/>
  
  <!-- Red bookmark -->
  <rect x="72" y="25" width="4" height="40" fill="#c41e3a"/>
</svg>
